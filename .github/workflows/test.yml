name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd main.go)"

  iptables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y iptables iproute2
      - name: Build integration test
        run: go test -c -o /tmp/msqi-integration.test ./cmd
      - name: Check real NAT in an isolated network namespace
        run: |
          sudo unshare --net -- sh -c '
            ip link set lo up
            MSQI_IPTABLES_TEST=1 /tmp/msqi-integration.test -test.run=^TestLinuxFirewallIntegration$ -test.v
          '
